<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display and Layout Example</title>
    <link rel="stylesheet" href="CSS-Display.css">
</head>
<body>
    <nav>
        <div class="nav-bar">
            <div class="brand">MyGallery</div>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Gallery</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="info-box">This block element is styled for a card-like look.</div>

        <div class="gallery">
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Nature 1">
                <p>Rocky Road</p>
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=800&q=80" alt="Nature 2">
                <p>Lake Mountain Trail</p>
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" alt="Nature 3">
                <p>Stream Sunset</p>
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80" alt="Nature 4">
                <p>Wild Landscape</p>
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80" alt="Nature 5">
                <p>River View</p>

            <div class="gallery-item hidden-item">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Hidden item">
                <p>Hidden Photo</p>
            </div>
            </div>
        </div>
    </div>
</body>
</html>
